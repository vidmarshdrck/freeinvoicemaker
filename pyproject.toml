[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freeinvoicemaker"
version = "1.0.0"
description = "Free Invoice Maker – a FastAPI invoicing application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "reportlab>=4.2.0",
    "pillow>=10.4.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
py-modules = ["launcher"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[project.scripts]
fim = "launcher:main"
