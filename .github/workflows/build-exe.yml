name: Build Windows Executable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller freeinvoicemaker.spec

      - name: Create ZIP archive
        run: Compress-Archive -Path dist/FreeInvoiceMaker/* -DestinationPath FreeInvoiceMaker-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeInvoiceMaker-windows
          path: FreeInvoiceMaker-windows.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: FreeInvoiceMaker-windows.zip
